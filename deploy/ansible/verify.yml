---
- name: Verify an installed SafeTerm host
  hosts: safeterm
  gather_facts: false
  become: true
  vars:
    safeterm_services:
      - safeterm-audit.service
      - safeterm-config-writer.service
      - safeterm-network-manager.service
      - safeterm-identity.service
      - safeterm-runner-diagnostics.service
      - safeterm-runner-network-observer.service
      - safeterm-runner-log-reader.service
      - safeterm-runner-service-manager.service
      - safeterm-gateway.service
      - safeterm-config-manager-application.service
      - safeterm-config-manager-database.service
      - safeterm-config-manager-network.service
      - safeterm-ssh-broker.service
  tasks:
    - name: Run installed preflight
      ansible.builtin.command: /usr/local/bin/safeterm-preflight --installed
      changed_when: false

    - name: Read service states
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}"]
      loop: "{{ safeterm_services }}"
      changed_when: false
