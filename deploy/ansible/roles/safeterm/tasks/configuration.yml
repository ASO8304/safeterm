---
- name: Validate managed SSH identity list
  ansible.builtin.assert:
    that:
      - safeterm_ssh_users | map(attribute='user_id') | list | unique | length == safeterm_ssh_users | length
      - item.user_id is match('^[A-Za-z0-9_.@-]+$')
      - item.roles | length > 0
      - (item.password_hash | default('') | length > 0) or (item.authorized_keys | default([]) | length > 0)
    fail_msg: Managed SSH users require unique safe IDs, roles, and a password hash or authorized keys.
  no_log: true
  loop: "{{ safeterm_ssh_users }}"
  loop_control:
    label: "{{ item.user_id | default('invalid') }}"
  when: safeterm_ssh_users | length > 0

- name: Manage complete SSH broker identity map
  ansible.builtin.template:
    src: ssh-users.json.j2
    dest: /etc/safeterm/ssh/users.json
    owner: root
    group: safeterm-broker
    mode: '0640'
    validate: /usr/bin/python3 -m json.tool %s
  no_log: true
  diff: false
  notify: Restart SafeTerm SSH broker
  when: safeterm_ssh_users | length > 0

- name: Validate managed console identity list
  ansible.builtin.assert:
    that:
      - safeterm_console_users | map(attribute='user_id') | list | unique | length == safeterm_console_users | length
      - item.user_id is match('^[A-Za-z0-9][A-Za-z0-9_.@-]*$')
      - item.roles | length > 0
      - (item.disabled | default(false)) or (item.password_hash | default('') | length > 0)
    fail_msg: Console users require unique internal IDs, roles and bcrypt hashes (or disabled=true).
  no_log: true
  loop: "{{ safeterm_console_users }}"
  when: safeterm_console_users | length > 0

- name: Manage complete console identity map
  ansible.builtin.template:
    src: console-users.json.j2
    dest: /etc/safeterm/console/users.json
    owner: root
    group: safeterm-identity
    mode: '0640'
    validate: /usr/bin/python3 -m json.tool %s
  no_log: true
  diff: false
  when: safeterm_console_users | length > 0

- name: Inspect Config Manager registry on the controller
  ansible.builtin.stat:
    path: "{{ safeterm_config_registry_file }}"
  delegate_to: localhost
  become: false
  register: safeterm_controller_registry
  when: safeterm_config_registry_file | length > 0

- name: Validate requested Config Manager registry
  ansible.builtin.assert:
    that: safeterm_controller_registry.stat.isreg | default(false)
    fail_msg: safeterm_config_registry_file must name a controller-side regular file.
  when: safeterm_config_registry_file | length > 0

- name: Manage complete Config Manager registry
  ansible.builtin.copy:
    src: "{{ safeterm_config_registry_file }}"
    dest: /etc/safeterm/config-manager/resources.json
    owner: root
    group: root
    mode: '0644'
    validate: /usr/bin/python3 -m json.tool %s
  notify: Restart SafeTerm control plane
  when: safeterm_config_registry_file | length > 0
