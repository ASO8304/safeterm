---
- name: Restart SafeTerm control plane
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
  loop:
    - safeterm-config-manager-application.service
    - safeterm-config-manager-database.service
    - safeterm-config-manager-network.service
    - safeterm-gateway.service
    - safeterm-ssh-broker.service
  listen: Restart SafeTerm control plane

- name: Restart SafeTerm SSH broker
  ansible.builtin.systemd_service:
    name: safeterm-ssh-broker.service
    state: restarted
