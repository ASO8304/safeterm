name: SafeTerm Security

on:
  push:
    branches: [ "main", "codex/**" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial:
    name: Adversarial and Race Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - run: make security 2>&1 | tee "$RUNNER_TEMP/security.log"
      - name: Report test failure diagnostics
        if: failure()
        run: python3 tests/ci/report-failure.py "$RUNNER_TEMP/security.log"
      - name: Test privileged configuration writer with an unprivileged client
        run: |
          go test -c -o "$RUNNER_TEMP/configmanager-root.test" ./internal/configmanager
          sudo "$RUNNER_TEMP/configmanager-root.test" -test.run '^TestPrivilegedWriterRootIntegration$' -test.v
          go test -c -o "$RUNNER_TEMP/termctl-root.test" ./cmd/termctl
          sudo "$RUNNER_TEMP/termctl-root.test" -test.run '^Test(ResourceRootFileBoundary|SiteLoaderIgnoresTemplateBeforeOpeningAndRejectsSourceLinks)$' -test.v

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.26.8"
          go-package: ./...

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request' && vars.SAFETERM_DEPENDENCY_REVIEW == 'enabled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          license-check: true

  dependency-integrity:
    name: Dependency Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - run: go mod verify
      - run: go list -m all

  codeql:
    name: CodeQL
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
      - run: go build ./...
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-results
      - name: Enforce zero CodeQL findings
        run: jq -e 'all(.runs[]; (.results // [] | length) == 0)' codeql-results/*.sarif
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 30
