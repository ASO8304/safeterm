name: Isolated Ubuntu 24.04 Netplan
on:
  workflow_call:
jobs:
  netplan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Install isolated guest tools
        run: sudo apt-get update && sudo apt-get install -y debootstrap systemd-container
      - name: Compile the real Netplan test
        run: go test -c -o "$RUNNER_TEMP/network.test" ./internal/networkmanager
      - name: Test live trial, confirmation and timeout in a separate Ubuntu guest
        run: sudo env SAFETERM_DISPOSABLE_HOST=1 bash tests/netplan/disposable.sh "$RUNNER_TEMP/network.test" 2>&1 | tee "$RUNNER_TEMP/netplan.log"
      - name: Report bounded guest failure diagnostics
        if: failure()
        run: python3 tests/ci/report-failure.py "$RUNNER_TEMP/netplan.log"
