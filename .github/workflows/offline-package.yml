name: SafeTerm Offline Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify SafeTerm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run full verification
        run: make verify

      - name: Run deployment and SSH end-to-end tests
        run: make e2e

      - name: Test privileged configuration writer with an unprivileged client
        run: |
          go test -c -o "$RUNNER_TEMP/configmanager-root.test" ./internal/configmanager
          sudo "$RUNNER_TEMP/configmanager-root.test" -test.run '^TestPrivilegedWriterRootIntegration$' -test.v
          go test -c -o "$RUNNER_TEMP/termctl-root.test" ./cmd/termctl
          sudo "$RUNNER_TEMP/termctl-root.test" -test.run '^TestResourceRootFileBoundary$' -test.v

  systemd-smoke:
    name: Fresh systemd installation and Console completion
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - name: Build installable package
        run: make offline-package OUTPUT="$RUNNER_TEMP/systemd-package" ARCH=amd64
      - name: Install on disposable VM and exercise real services and Console PTY
        run: sudo env SAFETERM_DISPOSABLE_HOST=1 bash tests/systemd/fresh-install.sh "$RUNNER_TEMP/systemd-package"

  package:
    name: Build offline package (${{ matrix.arch }})
    needs: [verify, systemd-smoke]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Build offline package
        run: |
          make offline-package \
            OUTPUT="$RUNNER_TEMP/safeterm-offline-${{ matrix.arch }}" \
            ARCH="${{ matrix.arch }}"

      - name: Archive package and create checksum
        run: |
          cd "$RUNNER_TEMP"
          tar -czf "safeterm-offline-${{ matrix.arch }}.tar.gz" \
            "safeterm-offline-${{ matrix.arch }}"
          sha256sum "safeterm-offline-${{ matrix.arch }}.tar.gz" \
            > "safeterm-offline-${{ matrix.arch }}.tar.gz.sha256"

      - name: Upload offline package artifact
        uses: actions/upload-artifact@v7
        with:
          name: safeterm-offline-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/safeterm-offline-${{ matrix.arch }}.tar.gz
            ${{ runner.temp }}/safeterm-offline-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release packages
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Download package artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: safeterm-offline-*
          merge-multiple: true
          path: release-assets

      - name: Publish package assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            notes=()
            if [ -f "docs/releases/$TAG_NAME.md" ]; then
              notes=(--notes-file "docs/releases/$TAG_NAME.md")
            fi
            gh release create "$TAG_NAME" release-assets/* "${notes[@]}" \
              --verify-tag \
              --generate-notes \
              --title "SafeTerm $TAG_NAME"
          fi
