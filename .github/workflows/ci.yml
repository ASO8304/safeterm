name: SafeTerm CI

on:
  push:
    branches: [ "main", "feature/**", "codex/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    name: Build, Vet, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'

      - name: Run full verification (fmt, vet, build, test)
        run: make verify
