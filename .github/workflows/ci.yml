name: SafeTerm CI

on:
  push:
    branches: [ "main", "feature/**", "codex/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    name: Build, Vet, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'

      - name: Run full verification (fmt, vet, build, test)
        run: make verify

  end-to-end:
    name: Deployment and SSH End-to-End
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'

      - name: Run deployment and public-boundary tests
        run: make e2e

  systemd-smoke:
    name: Fresh systemd installation and Console completion
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - name: Build installable package
        run: make offline-package OUTPUT="$RUNNER_TEMP/systemd-package" ARCH=amd64
      - name: Install on disposable VM and exercise real services and Console PTY
        run: sudo env SAFETERM_DISPOSABLE_HOST=1 bash tests/systemd/fresh-install.sh "$RUNNER_TEMP/systemd-package"
